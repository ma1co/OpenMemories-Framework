plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    // Jasmin 2.4 is only available from SourceForge. It is downloaded over HTTPS and pinned by its
    // SHA-256 checksum in gradle/verification-metadata.xml.
    ivy {
        url = 'https://downloads.sourceforge.net'
        patternLayout {
            artifact '/project/[organisation]/[module]/[module]-[revision]/[module]-[revision].[ext]'
        }
        metadataSources {
            artifact()
        }
        content {
            includeGroup 'jasmin'
        }
    }
}

configurations {
    jasmin
}

dependencies {
    jasmin 'jasmin:jasmin:2.4@zip'
}

def jasminSourceDir = file('src/main/jasmin')
def jasminClassesDir = layout.buildDirectory.dir('classes/jasmin/main')

def unpackAssembler = tasks.register('unpackAssembler', Copy) {
    // unpack the jasmin assembler
    from { zipTree(configurations.jasmin.singleFile) }
    into layout.buildDirectory.dir('jasmin')
    include '**/jasmin.jar'
    includeEmptyDirs = false
    eachFile { path = name }
}

def assembleJasmin = tasks.register('assembleJasmin', JavaExec) {
    // assemble the jasmin files
    dependsOn unpackAssembler
    def sources = fileTree(dir: jasminSourceDir, include: '**/*.j')

    inputs.files sources
    outputs.dir jasminClassesDir
    outputs.cacheIf { true }

    classpath = files(layout.buildDirectory.file('jasmin/jasmin.jar'))
    mainClass = 'jasmin.Main'
    workingDir = jasminSourceDir
    doFirst {
        args = ['-d', jasminClassesDir.get().asFile.absolutePath] +
            sources.files.collect { jasminSourceDir.toPath().relativize(it.toPath()).toString() }.sort()
    }
}

// Register the assembled classes as a classes directory, so they are part of the jar and visible to other
// projects in this build (e.g. :framework) at compile time
sourceSets.main.output.classesDirs.from(assembleJasmin)

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
