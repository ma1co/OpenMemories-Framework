plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly project(':stubs')
    // Android 4.1 (API 16) as found on newer cameras (e.g. ILCE-7M2, ILCE-7RM2). Cameras running Android 2.3
    // (API 10) only provide a subset; check DeviceInfo.getAndroidSdkVersion() before using newer APIs.
    compileOnly 'com.google.android:android:4.1.1.4'
}

java {
    // Java 8 is the lowest target supported by current JDKs. The Android build tools (d8) convert it for the
    // Dalvik VM of the cameras.
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
